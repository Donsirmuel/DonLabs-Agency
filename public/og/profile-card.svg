<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b1020"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#g)" opacity="0.08"/>

  <!-- Left card with avatar -->
  <g transform="translate(80,90)">
    <rect width="440" height="450" rx="24" fill="#0f1724" opacity="0.9"/>
    <rect x="8" y="8" width="424" height="434" rx="20" fill="#0b1220" opacity="0.6"/>

    <!-- Avatar circle -->
    <g transform="translate(40,36)">
      <circle cx="82" cy="82" r="82" fill="#111827" filter="url(#f)"/>
      <text x="82" y="100" font-family="Inter, Arial, sans-serif" font-size="64" fill="#ffffff" font-weight="700" text-anchor="middle" alignment-baseline="middle">SO</text>
    </g>

    <!-- Name and title inside card -->
    <text x="220" y="80" font-family="Inter, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">Samuel Olaonipekun</text>
    <text x="220" y="112" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Django • React • PostgreSQL</text>

    <!-- Short bio -->
    <foreignObject x="40" y="180" width="360" height="220">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: #cbd5e1; font-size:14px; line-height:1.3;">
        Web developer & solutions architect based in Lagos. I build high-performance websites, e-commerce platforms and custom APIs that help businesses increase conversions and automate operations.
      </div>
    </foreignObject>
  </g>

  <!-- Right content: brand + URL -->
  <g transform="translate(560,140)">
    <text x="0" y="40" font-family="Inter, Arial, sans-serif" font-size="42" fill="#ffffff" font-weight="800">Samuel Olaonipekun</text>
    <text x="0" y="92" font-family="Inter, Arial, sans-serif" font-size="22" fill="#cbd5e1">Django & React Developer • Lagos, Nigeria</text>

    <!-- Tagline / callout -->
    <rect x="0" y="120" width="520" height="90" rx="12" fill="#071023" opacity="0.7"/>
    <text x="20" y="160" font-family="Inter, Arial, sans-serif" font-size="20" fill="#9ae6b4">Trusted by Nigerian businesses • E‑commerce & custom apps</text>

    <!-- Tech badges -->
    <g transform="translate(0,230)">
      <rect x="0" y="0" width="150" height="40" rx="8" fill="#111827"/>
      <text x="18" y="26" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Django</text>
      <rect x="170" y="0" width="150" height="40" rx="8" fill="#111827"/>
      <text x="188" y="26" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">React</text>
      <rect x="340" y="0" width="200" height="40" rx="8" fill="#111827"/>
      <text x="360" y="26" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">PostgreSQL • Docker</text>
    </g>

    <!-- URL -->
    <text x="0" y="350" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94a3b8">donsirmuel.github.io/My-Portfolio</text>
  </g>

  <!-- Small footer brand -->
  <g transform="translate(80,560)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94a3b8">Built by Samuel • Available for hire • Lagos & Remote</text>
  </g>
</svg>
